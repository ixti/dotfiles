theme = "flexoki-dark"

[font]
family = "Victor Mono"
size   = 14
weight = "extra-light"

[platform_specific]
linux.decorations = false

[notifications.direct_message]
show_toast = true
exclude    = { users = ["NickServ", "ChanServ", "SaslServ"] }

[notifications.highlight]
show_toast = true

[notifications.monitored_online]
show_toast = true

[actions.buffer]
click_channel_name = "replace-pane"
click_highlight    = "replace-pane"
click_nickname     = "replace-pane"
join_channel       = "replace-pane"
local              = "replace-pane"
message_channel    = "replace-pane"
message_user       = "replace-pane"

[actions.sidebar]
buffer = "replace-pane"

[buffer.channel.nicklist]
enabled = false

[buffer.channel.topic_banner]
enabled = false

[buffer.nickname]
brackets = { left = "<", right = ">" }

[servers.Libera]
server    = "irc.libera.chat"
use_tls   = true
port      = 6697
channels  = ["#gentoo", "#gentoo-chat", "#gentoo-guru", "#ruby"]
nickname  = "ixti"

sasl.plain.username         = "ixti"
sasl.plain.password_keyring = true
